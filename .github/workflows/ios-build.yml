name: NetAdaptAI iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q NetAdaptAI_CloudBuild_FIXED.zip -d project-src

      - name: Build Simulator
        run: |
          xcodebuild \
            -project project-src/NetAdaptAI.xcodeproj \
            -scheme NetAdaptAI \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            build

      - name: Package Simulator
        run: |
          APP=$(find build-simulator/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          zip -r NetAdaptAI-Simulator.zip "$APP"

      - name: Build iPhone
        run: |
          xcodebuild \
            -project project-src/NetAdaptAI.xcodeproj \
            -scheme NetAdaptAI \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iPhone
        run: |
          APP=$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          zip -r NetAdaptAI-iPhone.zip "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: NetAdaptAI-build
          path: |
            NetAdaptAI-Simulator.zip
            NetAdaptAI-iPhone.zip
          retention-days: 14
